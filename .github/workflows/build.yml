name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: scripts/bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GitMarket
          path: build/GitMarket.zip
