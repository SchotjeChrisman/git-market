name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: GITMARKET_VERSION="${GITHUB_REF_NAME#v}" scripts/bundle.sh
      - run: gh release create "$GITHUB_REF_NAME" build/GitMarket.zip --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
